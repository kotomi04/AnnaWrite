<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#5BA8FF"/>
      <stop offset="100%" stop-color="#1E63E6"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5EEFB"/>
    </linearGradient>
    <linearGradient id="tab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#CFE0FA" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="folderShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.8"/>
      <feOffset dy="1" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#gloss)"/>

  <g filter="url(#folderShadow)">
    <path d="M16 22a3 3 0 0 1 3-3h7.6a3 3 0 0 1 2.12.88L31 21h2v3H16v-2z"
          fill="url(#tab)"/>
    <rect x="14" y="22" width="36" height="24" rx="5" fill="url(#folder)"/>
  </g>

  <path d="M16 25h32v1.2a1 1 0 0 1-1 1H17a1 1 0 0 1-1-1V25z"
        fill="#FFFFFF" fill-opacity="0.55"/>
